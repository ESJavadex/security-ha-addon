[global]
  server role = standalone server
  server string = seccam
  workgroup = WORKGROUP
  security = user
  map to guest = never
  restrict anonymous = 2
  server min protocol = SMB3
  smb encrypt = desired
  hosts allow = 192.168.1.148 192.168.1.156 127.0.0.1
  hosts deny = ALL
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
  log level = 1 auth:2
  passdb backend = tdbsam

[seccam]
  path = /data
  browseable = no
  read only = yes
  valid users = seccam hass
  write list = seccam
  force user = vault
  force group = vault
  create mask = 0644
  directory mask = 0755
  veto files = /.seccam-vault-marker/
  delete veto files = no
